[project]
name = "erdata"
version = "0.1.0"
description = "Elite Redux game data pipeline"
requires-python = ">=3.11"
dependencies = [
    "protobuf>=5.29",
    "grpcio-tools>=1.68",
    "pillow>=11.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/erdata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
